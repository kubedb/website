{{ $data := . }}
<div class="mb-20">
  <div class="p-12 is-radius-2xlarge has-text-centered" style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid #334155;">
    <h3 class="is-size-1 has-text-white has-text-weight-black mb-6">Think of it this way:</h3>
    <p class="is-size-2 has-text-secondary has-text-weight-black mb-12" style="color: #c084fc;">
      {{ $data.comparison_analogy | default "The Operator is the engine. The Platform is the car." }}
    </p>

    <div class="is-flex is-justify-content-center mb-10">
      <div class="has-max-width-lg w-full">
        <img src="/assets/images/products/kubedb/kubedb-hero.png" alt="Architecture Diagram"
          class="is-radius-large" style="opacity: 0.9;">
      </div>
    </div>

    <p class="has-text-grey-100 is-size-5 mx-auto has-max-width-800">
      The Platform provides centralized control and governance, orchestrating multiple Operator instances across
      different clusters and environments.
    </p>
  </div>
</div>
