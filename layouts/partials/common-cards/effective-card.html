{{ $effectiveCard := .effectiveCard }}
<div class="ds-card-base is-radius-2xlarge p-6 is-fullheight has-border transition-all has-hover-lift has-hover-shadow-medium"
  style="background-color: #ecfdf5; border-color: green;">
  <div class="is-flex is-align-items-flex-start has-gap-4">
    <div class="is-flex is-align-items-center is-justify-content-center is-flex-shrink-0 is-radius-large"
      style="width: 44px; height: 44px; background-color: #10b981;">
      <iconify-icon icon="lucide:check-circle-2" width="24" height="24" class="has-text-white"></iconify-icon>
    </div>
    <div class="is-flex-grow-1">
      <h4 class="is-size-5 has-text-weight-bold has-text-grey-900 has-line-height-tight mb-2">{{ $effectiveCard.title }}</h4>
      <p class="is-size-6 has-text-grey-600 has-line-height-normal mb-4">{{ $effectiveCard.description }}</p>
      {{ with $effectiveCard.highlight }}
      <span class="is-inline-flex is-align-items-center has-text-weight-bold is-size-7"
        style="background-color: #d1fae5; color: #047857; padding: 6px 12px; border-radius: 8px;">
        {{ . }}
      </span>
      {{ end }}
    </div>
  </div>
</div>
