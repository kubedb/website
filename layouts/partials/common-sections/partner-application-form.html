{{ $data := . }}
{{ with $data }}
<section id="partner-form" class="section-padding has-background-white">
  <div class="container">
    <div class="has-max-width-lg mx-auto">

      <div class="section-header has-text-centered mb-10">
        <h2 class="section-header-title has-text-weight-black is-size-2-desktop has-tracking-tighter">Ready to become a partner? <br> Join our program today and start earning!</h2>
      </div>

      <div class="ds-card-base is-radius-2xlarge p-8 has-shadow-large">
        <form action="{{ .action }}" method="POST">

          <div class="columns is-multiline">
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">First name <span class="has-text-danger">*</span></label>
                <div class="control">
                  <input class="input" type="text" name="first_name" placeholder="Start typing..." required>
                </div>
              </div>
            </div>
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">Last name <span class="has-text-danger">*</span></label>
                <div class="control">
                  <input class="input" type="text" name="last_name" placeholder="Start typing..." required>
                </div>
              </div>
            </div>
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">Company name <span class="has-text-danger">*</span></label>
                <div class="control">
                  <input class="input" type="text" name="company_name" placeholder="Start typing..." required>
                </div>
              </div>
            </div>
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">Job title <span class="has-text-danger">*</span></label>
                <div class="control">
                  <input class="input" type="text" name="job_title" placeholder="Start typing..." required>
                </div>
              </div>
            </div>
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">Work email <span class="has-text-danger">*</span></label>
                <div class="control has-icons-left">
                  <input class="input" type="email" name="work_email" placeholder="Start typing..." required>
                  <span class="icon is-left">
                    <iconify-icon icon="lucide:mail" width="16" height="16" class="has-text-grey-400"></iconify-icon>
                  </span>
                </div>
              </div>
            </div>
            <div class="column is-6-tablet">
              <div class="field">
                <label class="label body-md has-text-heading has-text-weight-bold mb-2">Phone number</label>
                <div class="control has-icons-left">
                  <input class="input" type="tel" name="phone_number" placeholder="Enter number">
                  <span class="icon is-left">
                    <iconify-icon icon="lucide:phone" width="16" height="16" class="has-text-grey-400"></iconify-icon>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <div class="field mb-6">
            <label class="label body-md has-text-heading has-text-weight-bold mb-2">How can we help?</label>
            <div class="control">
              <textarea class="textarea" name="message" placeholder="I would like more information on ..." rows="5"></textarea>
            </div>
          </div>

          <div class="field mb-6">
            <label class="checkbox is-flex is-align-items-center has-gap-2">
              <input type="checkbox" name="newsletter_consent" checked>
              <span class="body-md has-text-grey-600">I agree to receive communication on newsletters, promotional content, offers and events.</span>
            </label>
          </div>

          <div class="is-flex is-flex-wrap-wrap has-gap-3">
            <button type="submit" class="button is-primary is-flex-grow-1 height-50">
              <span>Submit Application</span>
              <iconify-icon icon="lucide:arrow-right" width="16" height="16"></iconify-icon>
            </button>
            <a href="https://appscode.com/contact/" class="button is-outlined height-50 px-6" target="_blank">
              <iconify-icon icon="lucide:message-square" width="16" height="16"></iconify-icon>
              <span>Contact Sales</span>
            </a>
          </div>

          <p class="body-md has-text-grey-400 has-text-centered mt-4">{{ .disclaimer }}</p>

        </form>
      </div>

    </div>
  </div>
</section>
{{ end }}
